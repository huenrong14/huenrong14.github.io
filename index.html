<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>验证页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #ffb6c1;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            text-align: center;
        }
        
        h1 {
            color: #d23369;
            margin-bottom: 30px;
            font-size: 2rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.8s 0.3s forwards;
        }
        
        .options {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }
        
        .btn {
            background-color: white;
            border: none;
            border-radius: 12px;
            padding: 15px 30px;
            font-size: 1.1rem;
            color: #d23369;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            font-weight: bold;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.8s 0.5s forwards;
        }
        
        .btn:nth-child(2) {
            animation-delay: 0.7s;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
        
        .btn:active {
            animation: jelly 0.5s;
        }
        
        .video-container {
            display: none;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            animation: slideIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        video {
            width: 100%;
            display: block;
        }
        
        /* 动画效果 */
        @keyframes jelly {
            0%, 100% {
                transform: scale(1, 1);
            }
            25% {
                transform: scale(0.95, 1.05);
            }
            50% {
                transform: scale(1.05, 0.95);
            }
            75% {
                transform: scale(0.98, 1.02);
            }
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* 撒花效果 */
        .confetti {
            position: absolute;
            width: 15px;
            height: 15px;
            background-color: #f00;
            opacity: 0;
            z-index: 999;
            animation: confettiFall 3s ease-in forwards;
        }
        
        @keyframes confettiFall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
        
        /* 响应式设计 */
        @media (max-width: 600px) {
            h1 {
                font-size: 1.5rem;
            }
            
            .options {
                flex-direction: column;
                gap: 15px;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="age-verification">
            <h1>本网站包含成人内容，请确认您的年龄</h1>
            <div class="options">
                <button class="btn" onclick="selectOption(true)">我已满18岁</button>
                <button class="btn" onclick="selectOption(false)">我未满18岁</button>
            </div>
        </div>
        
        <div id="video-player" class="video-container">
            <video id="rickroll-video" controls autoplay>
                <source src="video.mp4" type="video/video.mp4">
                您的浏览器不支持视频播放
            </video>
        </div>
        
        <audio id="laugh-sound" src="laugh.mp3" preload="auto"></audio>
    </div>

    <script>
        // 选择选项
        function selectOption(isAdult) {
            // 播放嘲笑音效
            const laughSound = document.getElementById('laugh-sound');
            laughSound.play().catch(e => console.log('自动播放被阻止:', e));
            
            // 创建撒花效果
            createConfetti();
            
            // 显示视频播放器
            document.getElementById('video-player').style.display = 'block';
            
            // 隐藏年龄验证
            document.getElementById('age-verification').style.display = 'none';
            
            // 自动播放视频
            const video = document.getElementById('rickroll-video');
            video.play().catch(e => {
                // 如果自动播放被阻止，显示控制条让用户手动播放
                video.controls = true;
            });
        }
        
        // 创建撒花效果
        function createConfetti() {
            const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];
            
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                
                // 随机位置
                const startX = Math.random() * window.innerWidth;
                
                // 随机颜色
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                
                // 随机大小
                const size = Math.random() * 10 + 5;
                
                // 随机形状
                const isRound = Math.random() > 0.5;
                
                confetti.style.left = startX + 'px';
                confetti.style.backgroundColor = randomColor;
                confetti.style.width = size + 'px';
                confetti.style.height = size + 'px';
                confetti.style.borderRadius = isRound ? '50%' : '0';
                
                // 随机动画延迟和持续时间
                confetti.style.animationDelay = Math.random() * 0.5 + 's';
                confetti.style.animationDuration = Math.random() * 2 + 2 + 's';
                
                document.body.appendChild(confetti);
                
                // 动画结束后移除元素
                setTimeout(() => {
                    confetti.remove();
                }, 5000);
            }
        }
    </script>
</body>
</html>
